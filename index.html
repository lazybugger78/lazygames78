<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LazyGames78 Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0c10;
            color: #c5c6c7;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #66fcf1;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: -1px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
        }
        .subtitle {
            color: #45f3ff;
            margin-bottom: 40px;
            font-size: 1.1rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 50px auto;
        }
        .search-bar {
            width: 100%;
            padding: 18px 28px;
            font-size: 1.2rem;
            background: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 50px;
            color: #fff;
            outline: none;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .search-bar:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 10px;
        }
        .game-card {
            background: #1f2833;
            border: 1px solid #2f3542;
            border-radius: 16px;
            padding: 25px;
            text-decoration: none;
            color: white;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 140px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .game-card:hover {
            transform: translateY(-8px);
            border-color: #66fcf1;
            background: #0b0c10;
            box-shadow: 0 12px 24px rgba(102, 252, 241, 0.2);
        }
        .game-card h3 {
            margin: 0;
            font-size: 1.3rem;
            color: #fff;
            text-transform: capitalize;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .game-card:hover h3 {
            color: #66fcf1;
        }
        .game-card .play-btn {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            opacity: 0.6;
        }
        .game-card:hover .play-btn {
            opacity: 1;
        }
        #no-results {
            display: none;
            color: #ff4757;
            font-size: 1.3rem;
            margin-top: 20px;
            font-weight: bold;
        }
        #loading {
            font-size: 1.5rem;
            color: #66fcf1;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>💤 LazyGames78</h1>
    <p class="subtitle">350+ Games • Unblocked • Instant Play</p>
    <div class="search-container">
        <input type="text" id="search" class="search-bar" placeholder="Type a game name to search instantly..." onkeyup="filterGames()">
    </div>
    <p id="loading">⚡ Loading Game Arcade Vault...</p>
    <p id="no-results">❌ No games found matching that search.</p>
    <div class="grid" id="games-grid"></div>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const repoUser = window.location.hostname.split('.')[0];
        const repoName = pathSegments[0] || '';
        const folderPath = 'offline'; // Pointing to your specific games folder!

        async function loadGames() {
            try {
                // Fixed broken dynamic template string url syntax from original code
                const response = await fetch(`https://github.com{repoUser}/${repoName}/contents/${folderPath}`);
                if (!response.ok) throw new Error();
                const files = await response.json();
                document.getElementById('loading').style.display = 'none';
                const grid = document.getElementById('games-grid');
                const htmlFiles = files.filter(file => file.name.endsWith('.html'));
                
                htmlFiles.forEach(file => {
                    let cleanName = file.name.replace('.html', '').replace(/-/g, ' ').replace(/_/g, ' ');
                    const card = document.createElement('a');
                    card.href = `./${folderPath}/${file.name}`;
                    card.className = 'game-card';
                    card.setAttribute('data-name', cleanName);
                    card.innerHTML = `<h3>${cleanName}</h3><div class="play-btn">🎮 Play Now</div>`;
                    grid.appendChild(card);
                });
            } catch (err) {
                document.getElementById('loading').innerText = "⚠️ Error reading the games directory.";
            }
        }

        function filterGames() {
            let input = document.getElementById('search').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            let noResults = document.getElementById('no-results');
            let visibleCount = 0;
            
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].getAttribute('data-name').toLowerCase();
                if (name.includes(input)) {
                    cards[i].style.display = "flex";
                    visibleCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }
            noResults.style.display = visibleCount === 0 ? "block" : "none";
        }

        loadGames();
    </script>
</body>
</html>
