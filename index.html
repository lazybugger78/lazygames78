<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Lazy Games</title>
    
    <!-- Link the games list created by your python script -->
    <script src="games.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #21262d;
        }

        header h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            margin-bottom: 10px;
        }

        header p {
            color: #8b949e;
        }

        /* Responsive 350+ Game Card Grid Layout */
        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Individual Game Card Styling */
        .game-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.2);
            border-color: #58a6ff;
        }

        /* Container to keep images square and neat */
        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #30363d;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-title {
            font-size: 1rem;
            font-weight: 600;
            color: #c9d1d9;
            /* Prevents long game names from breaking the card layout */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <h1>Unblocked Arcade</h1>
        <p>Browse through over 350+ classic offline games!</p>
    </header>

    <!-- The container where javascript will inject all 350+ game cards -->
    <main id="gameGrid" class="arcade-grid"></main>

    <script>
        // Wait for the HTML document to fully load
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("gameGrid");

            // Verify window.GAMES exists from games.js
            if (!window.GAMES || window.GAMES.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ff7b72;'>No games found! Make sure you ran 'python generate.py' and uploaded games.js.</p>";
                return;
            }

            // Loop through your 350+ games and build cards dynamically
            window.GAMES.forEach(game => {
                const card = document.createElement("a");
                card.className = "game-card";
                card.href = game.url; // Links straight to your local index.html or game folder

                // Safety: If github repo logo fails (404), it falls back to a clean initial badge
                const initialsFallback = `https://dicebear.com{encodeURIComponent(game.name)}&backgroundColor=58a6ff`;

                card.innerHTML = `
                    <div class="image-container">
                        <img 
                            src="${game.img}" 
                            alt="${game.name} Logo" 
                            class="game-logo"
                            onerror="this.onerror=null; this.src='${initialsFallback}';"
                        >
                    </div>
                    <div class="game-info">
                        <span class="game-title">${game.name}</span>
                    </div>
                `;

                grid.appendChild(card);
            });
        });
    </script>

</body>
</html>
