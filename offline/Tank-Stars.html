<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tank Masters Offline</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { background: #2c3e50; border: 4px solid #34495e; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px black; }
    </style>
</head>
<body>
    <div id="ui">P1: A/D to Drive, W to Aim, Space to Fire | P2: Arrows & Enter</div>
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let terrain = [];
        for(let i=0; i<=canvas.width; i++) {
            terrain[i] = 450 + Math.sin(i*0.01)*40 + Math.cos(i*0.005)*30;
        }

        class Tank {
            constructor(x, color, controls) {
                this.x = x; this.color = color; this.controls = controls;
                this.angle = -Math.PI/4; this.power = 12; this.score = 0;
            }
            draw() {
                let y = terrain[Math.floor(this.x)];
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - 15, y - 10, 30, 12);
                ctx.beginPath(); ctx.arc(this.x, y - 10, 10, 0, Math.PI, true); ctx.fill();
                ctx.strokeStyle = "white"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(this.x, y-10);
                ctx.lineTo(this.x + Math.cos(this.angle)*25, (y-10) + Math.sin(this.angle)*25);
                ctx.stroke();
            }
        }

        const p1 = new Tank(150, "#e74c3c", {left:'KeyA', right:'KeyD', up:'KeyW', down:'KeyS', fire:'Space'});
        const p2 = new Tank(850, "#3498db", {left:'ArrowLeft', right:'ArrowRight', up:'ArrowUp', down:'ArrowDown', fire:'Enter'});
        p2.angle = -3*Math.PI/4;

        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            if(keys[p1.controls.left] && p1.x > 20) p1.x -= 2;
            if(keys[p1.controls.right] && p1.x < 450) p1.x += 2;
            if(keys[p1.controls.up]) p1.angle -= 0.03;
            if(keys[p1.controls.down]) p1.angle += 0.03;

            if(keys[p2.controls.left] && p2.x > 550) p2.x -= 2;
            if(keys[p2.controls.right] && p2.x < 980) p2.x += 2;
            if(keys[p2.controls.up]) p2.angle -= 0.03;
            if(keys[p2.controls.down]) p2.angle += 0.03;
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#27ae60"; ctx.beginPath(); ctx.moveTo(0, canvas.height);
            for(let i=0; i<terrain.length; i++) ctx.lineTo(i, terrain[i]);
            ctx.lineTo(canvas.width, canvas.height); ctx.fill();
            p1.draw(); p2.draw();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
